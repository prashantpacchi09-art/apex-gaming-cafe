version: '3.8'

services:
  # 1. PostgreSQL 24/7 Cloud Database
  db:
    image: postgres:16-alpine
    container_name: apex_cafe_db
    restart: always
    environment:
      POSTGRES_DB: apex_gaming_cafe
      POSTGRES_USER: apex_admin
      POSTGRES_PASSWORD: apex_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - apex_postgres_data:/var/lib/postgresql/data

  # 2. FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apex_cafe_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://apex_admin:apex_secure_password_2026@db:5432/apex_gaming_cafe
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  apex_postgres_data:

