services:
  # 1. FastAPI Cloud Backend
  - type: web
    name: apex-cafe-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_USER
        value: prashvg615@gmail.com
      - key: SMTP_PASSWORD
        value: xtbpppxaomznwkcb

  # 2. Customer Web App
  - type: web
    name: apex-gamer-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://apex-cafe-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

  # 3. Staff & Admin Portal
  - type: web
    name: apex-admin-portal
    runtime: static
    rootDir: admin-portal
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://apex-cafe-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
